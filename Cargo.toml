[package]
name = "rust_face_id"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
opencv = { version = "0.92", default-features = false, features = ["dnn", "imgcodecs", "imgproc", "objdetect", "highgui"] }
walkdir = "2"
rayon = "1.8"
# GUI
eframe = "0.29" 
egui_extras = { version = "0.29", features = ["all_loaders"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3